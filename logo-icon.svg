<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NameVibe icon">
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="55%" stop-color="#241243"/>
      <stop offset="100%" stop-color="#160a2e"/>
    </linearGradient>
    <linearGradient id="ic-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#e0a52f"/>
    </linearGradient>
    <linearGradient id="ic-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a98bff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="ic-core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="60%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f5c451"/>
    </radialGradient>
  </defs>

  <!-- rounded-square badge -->
  <rect width="512" height="512" rx="112" fill="url(#ic-bg)"/>

  <!-- faint scattered stars -->
  <g fill="#f5c451" opacity=".5">
    <path d="M96 110 l4 11 12 1 -9 8 3 12 -10 -6 -10 6 3 -12 -9 -8 12 -1 z"/>
    <path d="M418 150 l3 8 9 1 -7 6 2 9 -7 -5 -7 5 2 -9 -7 -6 9 -1 z" opacity=".8"/>
    <circle cx="410" cy="392" r="4" opacity=".7"/>
    <circle cx="110" cy="404" r="3" opacity=".6"/>
  </g>

  <g transform="translate(256,256)">
    <!-- vibration arcs (the "Vibe") -->
    <g fill="none" stroke="url(#ic-violet)" stroke-linecap="round">
      <circle r="170" stroke-width="6" opacity=".3"/>
      <path d="M-156 0 A156 156 0 0 1 156 0" stroke-width="10" opacity=".55"/>
      <path d="M-118 0 A118 118 0 0 0 118 0" stroke-width="10" opacity=".75"/>
    </g>

    <!-- mandala petals -->
    <g fill="url(#ic-gold)" opacity=".95">
      <g id="ic-petal">
        <path d="M0 -170 C24 -128 24 -102 0 -74 C-24 -102 -24 -128 0 -170 Z"/>
      </g>
      <use href="#ic-petal" transform="rotate(45)"/>
      <use href="#ic-petal" transform="rotate(90)"/>
      <use href="#ic-petal" transform="rotate(135)"/>
      <use href="#ic-petal" transform="rotate(180)"/>
      <use href="#ic-petal" transform="rotate(225)"/>
      <use href="#ic-petal" transform="rotate(270)"/>
      <use href="#ic-petal" transform="rotate(315)"/>
    </g>

    <!-- glowing core -->
    <circle r="90" fill="url(#ic-core)"/>
    <circle r="90" fill="none" stroke="#ffffff" stroke-width="4" opacity=".5"/>

    <!-- stylised "N" -->
    <path d="M-38 38 V-38 L38 38 V-38"
          fill="none" stroke="#2a1a4a" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
